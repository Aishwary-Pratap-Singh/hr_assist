version: '3.8'

services:
  web:
    build: .
    command: uvicorn hr_assist.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: hr_assist_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

volumes:
  postgres_data: